# pytest 配置（2026-09-13 批次）：固定测试根为 tests/，裸 pytest 命令即可跑全量单测。
# 后端 Python 源码在 backend_py/（2026-10-19 起）：pythonpath 让测试模块照旧 `import db`
# 等扁平导入可用（conftest 里另有一份显式兜底）。
# e2e_*.py 不被本配置收集（python_files 保持默认 test_*.py）：
# Playwright 层用显式点名（./touchstone.sh test-ui），隔离实例脚本由 touchstone 编排调用。
[pytest]
testpaths = tests
pythonpath = backend_py
