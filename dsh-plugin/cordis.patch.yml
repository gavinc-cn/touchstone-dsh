# Touchstone dsh 插件包自带的组合行 —— bundle patch（2026-10-02 起）。
#
# 为什么行搬进包内而不是留在 profile patch:
#   dsh 的 Plugins 面板只把「包自带 patch 里 insert 出来的行」渲染成可开关的行
#   （dsh-plugin-manager 的 declaredRows(): 包未声明 dsh.bundle.patch 时 rows 为空），
#   手写在 profile cordis.patch.yml 里的 insert 在面板里既没有行也没有开关。
#   包内声明 + 在 profile 的 package.json 里把包名加进 dsh.profile.bundles 之后,
#   面板里就会出现 Touchstone 卡片与该行开关（开关写回 profile patch 的 disabled）。
#
# config 约定: repoDir 是**机器相关**路径（Touchstone 平台根，须含 webui/dist-plugin；
#   Python 后端入口为 backend_py/server.py，Node 后端入口为 backend/server.js），
#   不写死在这里 —— 由各 profile 的 cordis.patch.yml 用 `- id: touchstone-dsh` + `config:` 覆盖提供
#   （覆盖是整键替换，且 profile 层后于 bundle 层应用）。**2026-10-07 起 repoDir 可省**:
#   包已自包含（Node/Python 两版后端 + 预构建 webui/dist-plugin 都在包内），薄壳缺省回退到**包自身目录**
#   （lib/index.js 里 PACKAGE_DIR），只有要指向别的检出、或指定 pythonPath 时才写 config。
#   pythonPath 缺省 python3。
#
# name 必须是**完整包名**（与仓库根 package.json 的 name、scripts/build.mjs 生成的
# client.bundle.js 里的模块 id 三者逐字一致）；条目 id 是 touchstone-dsh（= 包名去掉 scope）。
# id 只是组合树里的**本地行键**（profile 覆盖行按它命中、Plugins 面板行开关按它写回），
# **不是包名**，改它必须与各 profile 的覆盖行同步 —— 否则覆盖落空（repoDir/pythonPath/disabled
# 全丢，回落包自身目录 + python3），面板开关还会在 profile patch 里追加一行、把旧行留成孤儿。
# 2026-10-09 由旧名 touchstone 改名（旧名是 2026-10-07 包改名前的残留）。
- insert:
    - id: touchstone-dsh
      name: "@gavinc-cn/touchstone-dsh"

# ── 第二行：自动提交守卫（id: dsh-autocommit，2026-11-01 并入本包）─────────────────
# 为什么它属于本包：这是 Touchstone 的**产品行为** —— 看板卡片一轮结束/挂起
# （agent/turn-stopping）时，把本会话改过的文件落成提交，卡片不会带着未提交改动停在那儿。
# 在此之前它以 @gavinc-cn/dsh-autocommit 独立组件包随 @gavinc-cn/dsh-plugins-runtime 分发；
# 并进本包后「装一个包就自带」：不用再单独装组件包，也不用跑内置资产安装。
#
# name 是本包的**子路径导出**（package.json 的 exports["./autocommit"] ⇒ dsh-plugin/autocommit/index.mjs）。
# 子路径当行名是 dsh 自己的既有形态（如 @deepseek-ai/dsh-plugin-manager/tools、
# @deepseek-ai/dsh-tool-subagent-control/list-agents）；client-modules 对子路径说明符直接判
# 「非 client 包」，所以它不会被当成第二个浏览器半，只加载宿主侧。
#
# 可调参数（要改才在 profile 的覆盖行里加 config:，缺省即下面的行为）：
#   enabled(true) / dryRun(false) / commitOnApproval(false) / maxBlocks(2) /
#   blockWindowMs(900000) / logPath(~/.kimi-code/hooks/logs/session_autocommit.dsh.log)
#   语义见 dsh-plugin/autocommit/index.mjs 的 normalizeConfig。
#
# **与旧的独立组件包互斥**：同一个行 id 在整棵组合树里只能出现一次。装本包就别再让
# @gavinc-cn/dsh-plugins-runtime 带 dsh-autocommit 那一行（该行已于 2026-11-01 退役），
# profile 里也不要再手写 `- insert: - id: dsh-autocommit`。
- insert:
    - id: dsh-autocommit
      name: "@gavinc-cn/touchstone-dsh/autocommit"
