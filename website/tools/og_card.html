<!doctype html>
<!--
  分享卡片模板（1200×630）——由 tools/make_og.py 用 Chromium 渲成
  assets/og-zh.png 与 assets/og-en.png，供 og:image / twitter:image 引用。

  直接双击本文件也能看：默认中文版，给 <html> 加上 class="lang-en" 就是英文版
  （与站内同一套语言开关机制，见 README「英文页的机制」）。

  设计口径：这是一张「一眼看到品牌与产品形态」的图——左边不用解释，右边不用猜。
  所以只放三层：字标、首屏同一句话、以及产品那张看板的五列。
  五列列名与卡片状态色一律照抄产品前端（BoardTab.jsx 的 COLUMNS / site.css 的
  .bd-card.is-run|.is-wait），不放数字、不放文案，避免看图的人把示意图当真实数据。

  :root 里的设计 token 抄自 assets/site.css——make_og.py 会逐值核对两者一致，
  改配色要两边一起改，否则脚本会直接报错拒绝出图。
-->
<html lang="zh-CN" class="og">
<head>
<meta charset="utf-8">
<title>Touchstone · 分享卡片模板</title>
<style>
/* ---------- 字体：只引这张图用得到的字重，路径相对本文件 ---------- */
@font-face { font-family:"TS Serif SC"; src:url("../assets/fonts/noto-serif-sc-900.woff2") format("woff2"); font-weight:900; font-display:block; }
@font-face { font-family:"TS Serif SC"; src:url("../assets/fonts/noto-serif-sc-700.woff2") format("woff2"); font-weight:700; font-display:block; }
@font-face { font-family:"TS Sans SC";  src:url("../assets/fonts/noto-sans-sc-400.woff2") format("woff2"); font-weight:400; font-display:block; }
@font-face { font-family:"TS Fraunces"; src:url("../assets/fonts/fraunces-900.woff2") format("woff2"); font-weight:900; font-display:block; }
@font-face { font-family:"TS Plex";     src:url("../assets/fonts/plex-sans-600.woff2") format("woff2"); font-weight:600; font-display:block; }
@font-face { font-family:"TS Mono";     src:url("../assets/fonts/jetbrains-mono-400.woff2") format("woff2"); font-weight:400; font-display:block; }

/* ---------- 设计 token（与 assets/site.css 的 :root 同值） ---------- */
:root {
  --night:#0B1426; --midnight:#141E36; --cloud:#F5F1E8; --star:#E8B86D;
  --ink-2:rgba(245,241,232,.72); --ink-3:rgba(245,241,232,.46);
  --rule:rgba(245,241,232,.13); --rule-soft:rgba(245,241,232,.07);
  --f-display-cjk:"TS Serif SC","Noto Serif SC","Songti SC",serif;
  --f-display-lat:"TS Fraunces","Fraunces",Georgia,serif;
  --f-text:"TS Plex","IBM Plex Sans","TS Sans SC","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"TS Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-mono-cjk:"TS Mono","JetBrains Mono",ui-monospace,"TS Sans SC","Noto Sans SC",sans-serif;
}

*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; padding:0; background:#555; }
body { font-family:var(--f-text); -webkit-font-smoothing:antialiased; }

/* ---------- 卡片本体 ---------- */
.card {
  position:relative; width:1200px; height:630px; overflow:hidden;
  background:var(--night); color:var(--cloud);
  display:flex; flex-direction:column;
}
/* 左上角一团极淡的星光：给纯色底一点纵深，别让它看着像没做背景 */
.card::before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(760px 420px at 8% -12%, rgba(232,184,109,.16), transparent 62%),
    radial-gradient(560px 360px at 96% 108%, rgba(123,200,214,.07), transparent 60%);
}

/* ---------- 字标 ---------- */
.brand { position:relative; display:flex; align-items:center; gap:15px; padding:58px 72px 0; }
.brand svg { flex:none; display:block; }
.word { font-family:var(--f-display-lat); font-weight:900; font-size:27px; letter-spacing:.09em; }
.word-cjk {
  font-family:var(--f-display-cjk); font-weight:700; font-size:20px;
  letter-spacing:.34em; color:var(--ink-3); margin-left:2px;
}

/* ---------- 首屏那句话（眉标 + 大标题，与站内 hero 同构） ---------- */
.mid { position:relative; flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 72px; }
.eyebrow {
  font-family:var(--f-mono-cjk); font-size:15px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--star); margin:0 0 20px;
}
h1 { margin:0; }
.h-cjk {
  font-family:var(--f-display-cjk); font-weight:900; font-size:88px;
  line-height:1.24; letter-spacing:.015em;
}
.h-cjk .lat { font-family:var(--f-display-lat); font-weight:900; letter-spacing:-.01em; }
.h-lat {
  font-family:var(--f-display-lat); font-weight:900; font-size:96px;
  line-height:1.08; letter-spacing:-.015em;
}

/* ---------- 底部：产品那张看板的五列 ---------- */
.board {
  position:relative; display:grid; grid-template-columns:repeat(5,minmax(0,1fr));
  border-top:1px solid var(--rule); padding-bottom:26px;
}
.bcol { padding:22px 24px 0; border-right:1px solid var(--rule-soft); min-width:0; }
.bcol:last-child { border-right:0; }
.bname {
  margin:0 0 15px; font-family:var(--f-display-cjk); font-weight:700;
  font-size:22px; letter-spacing:.06em; color:var(--cloud);
}
.lang-en .bname { font-family:var(--f-display-lat); font-weight:900; font-size:20px; letter-spacing:.01em; }

.cards { display:flex; flex-direction:column; gap:10px; }
/* 卡面里只画「文字条」，不写字：缩到聊天窗口的尺寸时字会糊成一团噪点 */
.bcard {
  height:46px; border-radius:7px; padding:0 13px;
  background:rgba(245,241,232,.035); border:1px solid var(--rule-soft);
  display:flex; flex-direction:column; justify-content:center; gap:7px;
}
.bcard i { display:block; height:5px; border-radius:3px; background:rgba(245,241,232,.22); }
.bcard i:last-child { width:48%; background:rgba(245,241,232,.13); }
/* 运行中 / 排队中：照抄 site.css 的 .bd-card.is-run 与 .is-wait */
.bcard.is-run { border-color:rgba(232,184,109,.32); box-shadow:inset 3.5px 0 0 -1px var(--star); }
.bcard.is-run i:first-child { background:rgba(232,184,109,.5); }
.bcard.is-wait { border-style:dashed; opacity:.72; }

/* ---------- 语言开关（与站内同一套机制） ---------- */
.en { display:none; }
.lang-en .en { display:block; }
.lang-en .zh { display:none; }
</style>
</head>
<body>
<div class="card">

  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="ogG" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#E8B86D"/><stop offset="1" stop-color="#F2A65A"/>
        </linearGradient>
      </defs>
      <path fill="url(#ogG)" fill-rule="evenodd"
        d="M8.6 3H15.4A5.6 5.6 0 0 1 21 8.6V15.4A5.6 5.6 0 0 1 15.4 21H8.6A5.6 5.6 0 0 1 3 15.4V8.6A5.6 5.6 0 0 1 8.6 3Z
           M7.6 6.6H16.4V9.8H13.6V17.8H10.4V9.8H7.6Z"/>
    </svg>
    <span class="word">TOUCHSTONE</span>
    <span class="word word-cjk zh">试金石</span>
  </div>

  <div class="mid">
    <p class="eyebrow zh">AI agent 驱动的自动化测试平台 · Free-style testing</p>
    <p class="eyebrow en">An AI-agent-driven test platform · Free-style testing</p>
    <h1 class="h-cjk zh">把测试交给 <span class="lat">agent</span>，<br>跑在真实代码上。</h1>
    <h1 class="h-lat en">An agent that tests<br>your real code.</h1>
  </div>

  <!-- 五列列名照抄产品：BoardTab.jsx 的 COLUMNS = 待开发/正在开发/阻塞/待审核/已完成。
       每列的卡数不等、且「正在开发」里一张运行中一张排队中，是为了让人一眼看出
       这是块在动的板子；数量本身不代表任何统计口径。 -->
  <div class="board">
    <div class="bcol">
      <h2 class="bname zh">待开发</h2><h2 class="bname en">To do</h2>
      <div class="cards"><div class="bcard"><i></i><i></i></div><div class="bcard"><i></i><i></i></div></div>
    </div>
    <div class="bcol">
      <h2 class="bname zh">正在开发</h2><h2 class="bname en">In progress</h2>
      <div class="cards">
        <div class="bcard is-run"><i></i><i></i></div>
        <div class="bcard is-wait"><i></i><i></i></div>
      </div>
    </div>
    <div class="bcol">
      <h2 class="bname zh">阻塞</h2><h2 class="bname en">Blocked</h2>
      <div class="cards"><div class="bcard"><i></i><i></i></div></div>
    </div>
    <div class="bcol">
      <h2 class="bname zh">待审核</h2><h2 class="bname en">In review</h2>
      <div class="cards"><div class="bcard"><i></i><i></i></div><div class="bcard"><i></i><i></i></div></div>
    </div>
    <div class="bcol">
      <h2 class="bname zh">已完成</h2><h2 class="bname en">Done</h2>
      <div class="cards"><div class="bcard"><i></i><i></i></div><div class="bcard"><i></i><i></i></div></div>
    </div>
  </div>

</div>
</body>
</html>
