<!doctype html>
<html lang="en" class="lang-en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live demo · Touchstone</title>
<meta name="description" content="Play with Touchstone in your browser — no install, no data needed. Drive the development board, the shared queue, agent questions and answers, seven-stage test tasks, the monitor panel and bug reports. The demo is a front-end simulation: no backend, nothing leaves your browser.">
<meta name="robots" content="index,follow">
<link rel="alternate" hreflang="zh-CN" href="./demo.html">
<link rel="alternate" hreflang="en" href="./en-demo.html">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/demo/demo.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body class="demo-body">

<header class="dtop">
  <a class="dtop-back" href="en.html">← Back to site</a>
  <span class="dtop-brand">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" fill-rule="evenodd"
        d="M8.6 3H15.4A5.6 5.6 0 0 1 21 8.6V15.4A5.6 5.6 0 0 1 15.4 21H8.6A5.6 5.6 0 0 1 3 15.4V8.6A5.6 5.6 0 0 1 8.6 3Z
           M7.6 6.6H16.4V9.8H13.6V17.8H10.4V9.8H7.6Z"/>
    </svg>
    <b>TOUCHSTONE</b><i>试金石</i>
  </span>
  <span class="dtop-tag" id="dtopTag">Live demo · front-end simulation, no backend</span>
  <span class="dtop-gap"></span>
  <span class="dtop-ctl">
    <label class="dtop-sel"><span id="speedLabel">Speed</span>
      <select id="speed">
        <option value="1">1×</option>
        <option value="2" selected>2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
    </label>
    <button type="button" class="dbtn dbtn-ghost" id="coachBtn">Guide</button>
    <button type="button" class="dbtn dbtn-ghost" id="resetBtn">Reset demo</button>
    <span class="lang"><a class="lang-off" href="demo.html" hreflang="zh-CN">中文</a><span class="lang-on">EN</span></span>
  </span>
</header>

<div id="app" class="dapp" aria-live="polite"></div>

<div id="coach" class="coach" hidden></div>

<div id="toast" class="dtoast" hidden></div>

<div id="layer" class="dlayer" hidden></div>

<script src="assets/demo/i18n.js"></script>
<script src="assets/demo/engine.js"></script>
<script src="assets/demo/ui.js"></script>
